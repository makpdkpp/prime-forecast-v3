; CGI/FastCGI defence in depth. Also set these in Plesk PHP Settings.
; Requires patched PHP; this file does NOT fix CVE-2026-109618.
; Must apply before request parsing, not via Laravel ini_set().
session.upload_progress.enabled = 0
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_include = Off
